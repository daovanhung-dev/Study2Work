[project]
name = "study2work-db-admin-server"
version = "0.1.0"
description = "Local-only PostgreSQL administration API for the Study2Work Neon database."
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.124.0",
    "PyJWT[crypto]>=2.10.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.45",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.19.0",
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
