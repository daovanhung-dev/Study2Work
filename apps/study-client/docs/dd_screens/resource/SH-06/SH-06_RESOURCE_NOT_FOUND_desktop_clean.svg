<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">SH-06 RESOURCE_NOT_FOUND — clean desktop view</title>
<desc id="desc">Study not-found state design target. The image contains no course identifiers, private data or live API response.</desc>
