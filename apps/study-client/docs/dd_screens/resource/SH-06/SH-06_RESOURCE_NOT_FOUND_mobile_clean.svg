<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
<title id="title">SH-06 RESOURCE_NOT_FOUND — clean 390px mobile view</title>
<desc id="desc">Study not-found state adapted for a narrow screen. All text and recovery actions remain visible.</desc>
<defs>
<filter id="haloShadow" x="-20%" y="-20%" width="140%" height="150%">
<feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#17324D" flood-opacity="0.055"/>
</filter>
</defs>
<rect width="390" height="844" fill="#F6FAFC"/>
<rect width="100%" height="72" fill="#FFFFFF"/>
<path d="M0 71.5H390" stroke="#D4E2E9" stroke-opacity="0.76"/>
<g id="element-01-brand-mark" aria-hidden="true"><rect x="24" y="18" width="36" height="36" rx="10" fill="#0B5F8A"/>
<path d="M35 26.5h10l5 5v13h-15z" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M45 26.8v4.8h4.8M38 37h8M38 41h8" fill="none" stroke="#FFFFFF" stroke-width="1.45" stroke-linecap="round"/>
</g>
<g id="element-02-wordmark" aria-hidden="true">
<text x="72" y="43" fill="#073B57" font-family="Noto Sans, Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">Study</text>
</g>
<g transform="translate(-419.80 401.10) scale(0.580)" aria-hidden="true">
<g id="element-08-soft-halo" aria-hidden="true">
<circle cx="1060" cy="455" r="190" fill="#E8F4FA" filter="url(#haloShadow)"/>
<circle cx="1060" cy="455" r="153" fill="#FFFFFF" opacity="0.52"/>
<circle cx="1060" cy="455" r="126" fill="none" stroke="#D4E2E9" stroke-opacity="0.42"/>
</g>
<g id="element-09-folded-page-illustration" aria-hidden="true">
<image href="SH-06_paper-illustration.png" x="858" y="250" width="420" height="420" preserveAspectRatio="xMidYMid meet"/>
</g>
<g id="element-12-accent-dots" aria-hidden="true">
<circle cx="900" cy="300" r="3.5" fill="#43A5C5"/>
<circle cx="1240" cy="420" r="4" fill="#43A5C5" opacity="0.86"/>
<circle cx="1204" cy="645" r="3" fill="#43A5C5" opacity="0.78"/>
</g>
<g id="element-10-dotted-route" aria-hidden="true">
<path d="M817 696H930" fill="none" stroke="#43A5C5" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
</g>
<g id="element-11-open-endpoint" aria-hidden="true">
<circle cx="948" cy="696" r="14.5" fill="#FFFFFF" stroke="#0B5F8A" stroke-width="3"/>
<circle cx="948" cy="696" r="4" fill="#43A5C5"/>
</g>
</g>
<g id="element-03-state-eyebrow">
<text x="24" y="116" fill="#0B5F8A" font-family="Noto Sans, Arial, sans-serif" font-size="12px" font-weight="700" text-anchor="start" letter-spacing="0.45px">KHÓA HỌC KHÔNG KHẢ DỤNG</text>
</g>
<g id="element-04-page-heading">
<text x="24" y="166" fill="#073B57" font-family="Noto Sans, Arial, sans-serif" font-size="32px" font-weight="700" text-anchor="start">Không tìm thấy</text>
<text x="24" y="204" fill="#073B57" font-family="Noto Sans, Arial, sans-serif" font-size="32px" font-weight="700" text-anchor="start">khóa học này</text>
</g>
<g id="element-05-supporting-copy">
<text x="24" y="257" fill="#536A7A" font-family="Noto Sans, Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Khóa học này hiện không khả dụng.</text>
<text x="24" y="282" fill="#536A7A" font-family="Noto Sans, Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Bạn có thể chọn một khóa học khác.</text>
</g>
<g id="element-06-primary-action" aria-label="Primary action button">
<rect x="24" y="328" width="342" height="54" rx="10" fill="#0B5F8A"/>
<text x="195.0" y="362" fill="#FFFFFF" font-family="Noto Sans, Arial, sans-serif" font-size="16px" font-weight="600" text-anchor="middle">Tìm khóa học</text>
</g>
<g id="element-07-home-link" aria-label="Secondary home navigation link">
<text x="24" y="420" fill="#0B5F8A" font-family="Noto Sans, Arial, sans-serif" font-size="15px" font-weight="600" text-anchor="start">Về trang chủ</text>
<path d="M123 415h11m-4-4 4 4-4 4" fill="none" stroke="#0B5F8A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
