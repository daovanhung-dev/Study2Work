<study-st03-profile-frame
  class="profile-edit-screen"
  data-screen-id="ST-03"
  [fullName]="profile()?.full_name ?? null"
>
  <main class="profile-edit-main">
    <div class="profile-edit-breadcrumb-row">
      <nav class="profile-edit-breadcrumb" aria-label="Breadcrumb">
        <a routerLink="/">Hệ thống</a>
        <span aria-hidden="true">›</span>
        <a routerLink="/student/profile">Hồ sơ cá nhân</a>
        <span aria-hidden="true">›</span>
        <span aria-current="page">Chỉnh sửa hồ sơ</span>
      </nav>
      <span class="profile-edit-gate-pill">
        <span aria-hidden="true"></span>
        Tiểu sử chưa thể chỉnh sửa
      </span>
    </div>

    <section class="profile-edit-gate-banner" aria-labelledby="profile-edit-gate-title">
      <span class="profile-edit-gate-banner__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="5" y="10" width="14" height="11" rx="2" />
          <path d="M8 10V7a4 4 0 0 1 7.7-1.5M12 14v3m0-3a1.5 1.5 0 1 0 0 3" />
        </svg>
      </span>
      <div class="profile-edit-gate-banner__copy">
        <h1 id="profile-edit-gate-title">Chỉnh sửa hồ sơ học viên</h1>
        <p>
          Cập nhật họ tên, số điện thoại và ảnh đại diện. Tiểu sử hiện chỉ có thể xem.
        </p>
      </div>
      <a class="profile-edit-button profile-edit-button--secondary" routerLink="/student/profile">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M19 12H5m0 0 6 6m-6-6 6-6" />
        </svg>
        Quay lại hồ sơ cá nhân
      </a>
    </section>

    <div class="profile-edit-columns">
      <study-st03-profile-avatar-panel
        [profileLoading]="profileLoading()"
        [profile]="profile()"
        [avatarPreviewUrl]="avatarPreviewUrl()"
        [avatarUploadState]="avatarUploadState()"
        [avatarError]="avatarError()"
        [saving]="saving()"
        [refreshingAfterSave]="refreshingAfterSave()"
        [savedAwaitingRefresh]="savedAwaitingRefresh()"
        (avatarFileSelected)="selectAvatar($event)"
        (uploadRequested)="uploadAvatar()"
      />

      <study-st03-profile-details-form
        [profile]="profile()"
        [profileLoading]="profileLoading()"
        [profileError]="profileError()"
        [fullName]="fullName()"
        [phone]="phone()"
        [saving]="saving()"
        [refreshingAfterSave]="refreshingAfterSave()"
        [savedAwaitingRefresh]="savedAwaitingRefresh()"
        [canSave]="canSave()"
        [saveError]="saveError()"
        (fullNameChanged)="setFullName($event)"
        (phoneChanged)="setPhone($event)"
        (retryRequested)="retryProfile()"
        (saveSubmitted)="saveProfile($event)"
      />
    </div>
  </main>
</study-st03-profile-frame>
