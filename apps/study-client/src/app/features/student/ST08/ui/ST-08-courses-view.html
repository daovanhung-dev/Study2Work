<div class="courses-page" [attr.data-state]="state.kind">
  <main class="container main-wrap">
    <h1 class="page-heading">Khóa học của tôi</h1>

    <div class="empty-card">
      <div class="icon-circle">📘</div>
      <h2>{{ state.title }}</h2>
      <p>{{ state.message }}</p>
      <a href="/student" class="btn-primary">Về tổng quan học viên</a>
    </div>
  </main>
</div>
