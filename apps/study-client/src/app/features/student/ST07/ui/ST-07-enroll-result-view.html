<div class="checkout-page" [attr.data-state]="state.kind">
  <main class="container main-wrap">
    <div class="crumb-row">
      <a href="/">Trang chủ</a>
      <span>›</span>
      <span>Khóa học</span>
      <span>›</span>
      <span class="crumb-active">Kết quả đăng ký khóa học</span>
    </div>

    <h1 class="page-heading">Kết quả đăng ký khóa học</h1>

    <div class="center-area">
      <div class="gate-card">
        <div class="icon-circle" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" focusable="false">
            <path d="M17 9h-5a3 3 0 0 0-3 3v27a3 3 0 0 0 3 3h24a3 3 0 0 0 3-3V12a3 3 0 0 0-3-3h-5" />
            <path d="M20 6a4 4 0 0 1 8 0h3v8H17V6h3Z" />
            <path d="m17 27 5 5 10-11" />
          </svg>
        </div>
        <h2>{{ state.title }}</h2>
        <p>{{ state.message }}</p>
        <a href="/student/courses" class="btn-primary">Về khóa học của tôi</a>
      </div>
    </div>
  </main>
</div>
