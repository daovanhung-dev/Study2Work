<main class="login-screen">
  <section class="login-card" aria-labelledby="login-title">
    <header class="login-intro">
      <a class="brand" href="/" aria-label="Study2Work — về trang chủ">
        <span class="brand-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m2 9 10-5 10 5-10 5L2 9Z" />
            <path d="M6 11v5c3.5 2.8 8.5 2.8 12 0v-5" />
            <path d="M22 9v7" />
          </svg>
        </span>
        <span class="brand-copy"
          ><strong>Study<span>2Work</span></strong
          ><small>STUDY LMS</small></span
        >
      </a>
      <h1 id="login-title">Đăng nhập</h1>
      <p>Nhập thông tin tài khoản để truy cập hệ thống học tập Study LMS</p>
    </header>

    @if (alert) {
      <div
        class="login-alert"
        [class.login-alert--info]="alert.kind === 'info'"
        role="alert"
        tabindex="-1"
      >
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 8v5m0 3h.01" />
        </svg>
        <span
          ><strong>{{ alert.title }}</strong
          ><span>{{ alert.description }}</span></span
        >
      </div>
    }

    <form (ngSubmit)="submit()">
      <div class="form-field">
        <label for="login-email">Địa chỉ email <span aria-hidden="true">*</span></label>
        <div class="input-wrap" [class.input-wrap--error]="fieldErrors.email">
          <svg
            class="field-icon"
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m4 7 8 6 8-6" />
          </svg>
          <input
            #emailInput
            id="login-email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="name@example.com"
            required
            [disabled]="submitting"
            [attr.aria-invalid]="fieldErrors.email ? true : null"
            [attr.aria-describedby]="fieldErrors.email ? 'login-email-error' : null"
            [(ngModel)]="email"
            (ngModelChange)="edit.emit()"
          />
        </div>
        @if (fieldErrors.email) {
          <p class="field-error" id="login-email-error">{{ fieldErrors.email }}</p>
        }
      </div>

      <div class="form-field">
        <label for="login-password">Mật khẩu <span aria-hidden="true">*</span></label>
        <div class="input-wrap" [class.input-wrap--error]="fieldErrors.password">
          <svg
            class="field-icon"
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="5" y="10" width="14" height="11" rx="2" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
            <circle cx="12" cy="15" r="1" />
          </svg>
          <input
            #passwordInput
            id="login-password"
            name="password"
            [type]="passwordVisible ? 'text' : 'password'"
            autocomplete="current-password"
            placeholder="Nhập mật khẩu"
            required
            [disabled]="submitting"
            [attr.aria-invalid]="fieldErrors.password ? true : null"
            [attr.aria-describedby]="fieldErrors.password ? 'login-password-error' : null"
            [(ngModel)]="password"
            (ngModelChange)="edit.emit()"
          />
          <button
            class="visibility-button"
            type="button"
            [attr.aria-label]="passwordVisible ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
            [attr.aria-pressed]="passwordVisible"
            (click)="passwordVisible = !passwordVisible"
          >
            @if (passwordVisible) {
              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M3 3 21 21M10.6 10.7a2 2 0 0 0 2.7 2.7" />
                <path
                  d="M9.7 5.5a10.3 10.3 0 0 1 2.3-.3c4.7 0 8.2 3.1 10 6.8a11.8 11.8 0 0 1-3.5 4.3M6.4 6.4A12 12 0 0 0 2 12c1.8 3.7 5.3 6.8 10 6.8 1 0 2-.1 2.9-.4"
                />
              </svg>
            } @else {
              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z" />
                <circle cx="12" cy="12" r="2.5" />
              </svg>
            }
          </button>
        </div>
        @if (fieldErrors.password) {
          <p class="field-error" id="login-password-error">{{ fieldErrors.password }}</p>
        }
      </div>

      <button class="submit-button" type="submit" [disabled]="submitting">
        {{ submitting ? 'Đang đăng nhập…' : 'Đăng nhập' }}
      </button>
    </form>

    <footer class="login-footer">Chưa có tài khoản? <a href="/register">Đăng ký ngay</a></footer>
  </section>
</main>
