<main class="verification-shell" data-screen-id="SH-04">
  <div class="verification-content">
    <a class="verification-brand" routerLink="/" aria-label="Study2Work LMS — trang chủ">
      <span class="verification-brand__mark" aria-hidden="true">S2W</span>
      <span>Study2Work LMS</span>
    </a>

    <section class="verification-card" aria-labelledby="verification-title">
      <p class="verification-card__eyebrow">Xác minh email</p>
      <h1 id="verification-title">Chưa thể xác minh email</h1>
      <p class="verification-card__message" role="status">
        Tính năng xác minh email chưa được kết nối. Màn hình này không gửi email và không xác nhận
        trạng thái email của tài khoản.
      </p>
      <p class="verification-card__detail">
        Hiện chưa có mã OTP hoặc đường dẫn xác minh để tiếp tục. Bạn có thể quay lại đăng nhập.
      </p>

      <a class="verification-action" routerLink="/login">Quay lại đăng nhập</a>
    </section>
  </div>
</main>
