@if (state === 'contract-blocked') {
  <section class="availability-panel" role="status" aria-labelledby="gs07-status-heading">
    <span class="availability-icon" aria-hidden="true">
      <study-icon name="info" />
    </span>
    <div class="availability-copy">
      <h1 id="gs07-status-heading">Chưa thể mở tài nguyên này</h1>
      <p>Hiện chưa thể hiển thị hoặc tải tài nguyên này.</p>
    </div>
  </section>
}
