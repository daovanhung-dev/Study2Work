@if (state === 'contract-blocked') {
  <section class="availability-panel" role="status" aria-labelledby="gs06-status-heading">
    <span class="availability-icon" aria-hidden="true">
      <study-icon name="info" />
    </span>
    <div class="availability-copy">
      <h2 id="gs06-status-heading">Tài nguyên hiện chưa khả dụng</h2>
      <p>Hiện chưa thể hiển thị hoặc mở tài nguyên của khóa học này.</p>
    </div>
  </section>
}
