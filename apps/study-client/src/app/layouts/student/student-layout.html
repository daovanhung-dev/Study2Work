<div class="student-layout">
  <header class="student-header">
    <div class="shell-container header-inner">
      <a class="brand" routerLink="/student" aria-label="Study2Work LMS — trang chủ học viên">
        <span class="brand-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m2 9 10-5 10 5-10 5L2 9Z" />
            <path d="M6 11v5c3.5 2.8 8.5 2.8 12 0v-5" />
            <path d="M22 9v7" />
          </svg>
        </span>
        <span class="brand-copy"><strong>Study2Work</strong><small>LMS PLATFORM</small></span>
      </a>

      <nav
        id="student-primary-nav"
        class="student-nav"
        [class.open]="mobileNavOpen"
        aria-label="Điều hướng học viên"
      >
        <a
          routerLink="/student"
          [class.active]="section() === 'overview'"
          [attr.aria-current]="section() === 'overview' ? 'page' : null"
          (click)="closeMenu()"
          >Trang chủ</a
        >
        <a
          routerLink="/student/courses"
          [class.active]="section() === 'myCourses'"
          [attr.aria-current]="section() === 'myCourses' ? 'page' : null"
          (click)="closeMenu()"
          >Khóa học của tôi</a
        >
        <span
          class="nav-unavailable"
          aria-disabled="true"
          title="Màn Tiến độ ST-20 chưa được triển khai"
          >Tiến độ</span
        >
        <span
          class="nav-unavailable"
          aria-disabled="true"
          title="Màn Thảo luận ST-23 chưa được triển khai"
          >Thảo luận</span
        >
        <span
          class="nav-unavailable"
          aria-disabled="true"
          title="Màn Thông báo ST-26 chưa được triển khai"
          >Thông báo</span
        >
      </nav>

      <div class="header-actions">
        <button
          type="button"
          class="menu-toggle"
          aria-controls="student-primary-nav"
          [attr.aria-expanded]="mobileNavOpen"
          [attr.aria-label]="mobileNavOpen ? 'Đóng menu học viên' : 'Mở menu học viên'"
          (click)="mobileNavOpen = !mobileNavOpen"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            @if (mobileNavOpen) {
              <path d="M5 5 19 19M19 5 5 19" />
            } @else {
              <path d="M4 6h16M4 12h16M4 18h16" />
            }
          </svg>
        </button>
        <a
          class="student-account"
          routerLink="/student/profile"
          [class.active]="section() === 'profile'"
          [attr.aria-current]="section() === 'profile' ? 'page' : null"
          aria-label="Hồ sơ học viên"
        >
          <span class="account-copy"><strong>Hồ sơ</strong><small>HỌC VIÊN</small></span>
          <span class="account-avatar" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="8" r="3" />
              <path d="M5 19c.6-3.1 3.2-5 7-5s6.4 1.9 7 5" />
            </svg>
          </span>
        </a>
      </div>
    </div>
  </header>

  <div class="student-content"><router-outlet /></div>

  <footer class="student-footer">
    <div class="shell-container footer-inner">
      <div class="footer-meta">
        <small>© {{ currentYear }} Study2Work LMS. All rights reserved.</small>
        <span class="footer-separator" aria-hidden="true">•</span>
        <span class="accessibility-note"><span aria-hidden="true">◎</span> Hỗ trợ tiếp cận</span>
      </div>
      <nav class="footer-nav" aria-label="Thông tin và hỗ trợ">
        <span aria-disabled="true" title="Trang điều khoản chưa được triển khai"
          >Điều khoản dịch vụ</span
        >
        <span aria-disabled="true" title="Trang chính sách chưa được triển khai"
          >Chính sách bảo mật</span
        >
        <span aria-disabled="true" title="Trang trợ giúp chưa được triển khai">Trợ giúp</span>
      </nav>
    </div>
  </footer>
</div>
