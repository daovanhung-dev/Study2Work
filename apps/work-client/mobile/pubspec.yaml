name: study2work_mobile
description: "Study2Work mobile client for Student and Business roles."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.3.0
  path: ^1.9.0
  cupertino_icons: ^1.0.8
  postgres: ^3.5.12
  http: ^1.5.0
  intl: ^0.20.3
  shimmer: ^3.0.0
  fl_chart: ^1.1.1
  sqflite_common_ffi: ^2.3.6
  rename_app: ^1.6.5
  connectivity_plus: ^6.0.3
  flutter_riverpod: ^3.3.2
  go_router: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  default-flavor: student
  assets:
    - assets/student/
    - assets/business/

  uses-material-design: true
