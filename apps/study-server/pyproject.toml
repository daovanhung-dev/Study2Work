[project]
name = "study2work-study-api"
version = "0.1.0"
description = "Study2Work Study API foundation."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.17.0",
    "asyncpg>=0.30.0",
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.0.0",
    "fastapi>=0.124.0",
    "PyJWT[crypto]>=2.10.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.3,<6.5",
    "sqlalchemy[asyncio]>=2.0.45",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.19.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
pythonpath = ["."]
