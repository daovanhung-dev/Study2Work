services:
  study-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: study2work_study
      POSTGRES_USER: study2work
      POSTGRES_PASSWORD: study2work
    ports:
      - "5433:5432"
    volumes:
      - study_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study2work -d study2work_study"]
      interval: 10s
      timeout: 5s
      retries: 5

  study-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - study_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  work-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: study2work_work
      POSTGRES_USER: study2work
      POSTGRES_PASSWORD: study2work
    ports:
      - "5434:5432"
    volumes:
      - work_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study2work -d study2work_work"]
      interval: 10s
      timeout: 5s
      retries: 5

  work-redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - work_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  study-api:
    build:
      context: ./apps/study-server
    environment:
      APP_ENV: local
      CORS_ORIGINS: http://127.0.0.2:3002,http://127.0.0.2:3001
      DB_HOST: study-postgres
      DB_PORT: 5432
      DB_NAME: study2work_study
      DB_USER: study2work
      DB_PASSWORD: study2work
      REDIS_URL: redis://study-redis:6379/0
      JWT_ALGORITHM: HS256
      JWT_SECRET_KEY: local-development-secret-must-have-at-least-32-characters
      JWT_ISSUER: study2work
      JWT_AUDIENCE: study-api
      REFRESH_TOKEN_PEPPER: local-development-refresh-pepper-must-have-at-least-32-chars
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      study-postgres:
        condition: service_healthy
      study-redis:
        condition: service_healthy

  work-api:
    build:
      context: .
      dockerfile: apps/work-server/Dockerfile
    ports:
      - "127.0.0.1:3002:3002"
    # Lets a locally running Identity/JWKS service be reached from Linux
    # Docker engines as well as Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      work-postgres:
        condition: service_healthy
      work-redis:
        condition: service_healthy

  work-web:
    build:
      context: .
      dockerfile: apps/work-client/web/Dockerfile
    ports:
      - "127.0.0.2:3001:80"
    depends_on:
      work-api:
        condition: service_started

volumes:
  study_postgres_data:
  study_redis_data:
  work_postgres_data:
  work_redis_data:
  minio_data:
